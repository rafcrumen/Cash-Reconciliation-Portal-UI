<form [formGroup]="form" (ngSubmit)="filter()" class="flex flex-col p-5 bg-white max-h-[80vh]">

    <div class="pb-4 border-b border-slate-100 flex items-center gap-2">
        <i class="material-icons text-blue-600">wallet</i>
        <h2 class="text-xl font-bold text-slate-800">
            {{ 'DEPOSIT_ACTIONS.FILTER' | translate }}
        </h2>
    </div>
    <!-- <div class="flex-1 overflow-y-auto py-5 flex flex-col gap-4 min-w-[260px] md:min-w-[320px]"> -->
    <!-- Cambié overflow-y-auto por overflow-y-auto overflow-x-hidden, y quité los min-w -->
    <div class="flex-1 overflow-y-auto overflow-x-hidden py-5 flex flex-col gap-4 w-full">
        <mat-form-field appearance="outline" class="w-full">
            <mat-label>{{ 'DEPOSIT.NUMBER' | translate }}</mat-label>
            <input matInput formControlName="depositNumber" placeholder="DEPXXXX">
        </mat-form-field>
        <mat-form-field appearance="outline" class="w-full">
            <mat-label>{{ 'DEPOSIT.STORE' | translate }}</mat-label>
            <input matInput formControlName="storeNumber" placeholder="STXXXX">
        </mat-form-field>
        <mat-form-field appearance="outline" class="w-full">
            <mat-label>{{ 'DEPOSIT.FECHAINI' | translate }}</mat-label>
            <input matInput [matDatepicker]="pickerini" formControlName="fechaInicio">
            <mat-datepicker-toggle matIconSuffix [for]="pickerini"></mat-datepicker-toggle>
            <mat-datepicker #pickerini></mat-datepicker>
        </mat-form-field>
        <mat-form-field appearance="outline" class="w-full">
            <mat-label>{{ 'DEPOSIT.FECHAFIN' | translate }}</mat-label>
            <input matInput [matDatepicker]="pickerfin" formControlName="fechaFin">
            <mat-datepicker-toggle matIconSuffix [for]="pickerfin"></mat-datepicker-toggle>
            <mat-datepicker #pickerfin></mat-datepicker>
        </mat-form-field>
    </div>
    <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
        <button type="button" (click)="cancel()"
            class="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition duration-200 cursor-pointer">
            {{ 'BUTTONS.CANCEL' | translate }}
        </button>
        <button type="button" (click)="clean()"
            class="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition duration-200 cursor-pointer">
            {{ 'BUTTONS.CLEAN' | translate }}
        </button>
        <button type="submit" [disabled]="form.invalid"
            class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 disabled:bg-slate-200 disabled:text-slate-400 disabled:cursor-not-allowed rounded-lg shadow-sm transition duration-200 cursor-pointer">
            {{ 'BUTTONS.FILTER' | translate }}
        </button>

    </div>
</form>
